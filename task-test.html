<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase 接続テスト</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; background-color: #fafafa; color: #333; }
        h1 { font-size: 22px; color: #2c3e50; text-align: center; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .status-container { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;}
        .status { font-weight: bold; color: #e67e22; }
        .status.connected { color: #2ecc71; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        button { padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { background: #f8f9fa; padding: 12px; margin-bottom: 8px; border-radius: 6px; border-left: 4px solid #3498db; }
    </style>
</head>
<body>

    <h1>🔥 Firebase 接続テスト</h1>
    
    <div class="box">
        <div class="status-container">
            <span>クラウド接続状態:</span>
            <span id="status" class="status">接続中...</span>
        </div>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="ここにタスクを入力してください">
            <button id="addBtn">追加する</button>
        </div>
    </div>

    <div class="box">
        <h3>リアルタイム同期データ一覧</h3>
        <ul id="taskList">
            <div id="emptyMsg" style="color:#999; text-align:center; padding:20px 0;">データがありません。</div>
        </ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ===================================================
        // 【重要】あなたのFirebaseプロジェクトの設定に差し替えてください
        // ===================================================
        const firebaseConfig = {
            apiKey: "ここに貼る",
            authDomain: "ここに貼る",
            projectId: "ここに貼る",
            storageBucket: "ここに貼る",
            messagingSenderId: "ここに貼る",
            appId: "ここに貼る"
        };

        const statusEl = document.getElementById('status');
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            statusEl.innerText = "接続成功！"; statusEl.classList.add('connected');

            // 1. クラウドに「自動保存」する処理
            addBtn.addEventListener('click', async () => {
                const text = taskInput.value.trim();
                if (text === '') return;
                await addDoc(collection(db, "mytasks"), { title: text, createdAt: Date.now() });
                taskInput.value = '';
            });

            // 2. クラウドのデータを「自動でリアルタイム受信」する処理
            const q = query(collection(db, "mytasks"), orderBy("createdAt", "desc"));
            onSnapshot(q, (querySnapshot) => {
                taskList.innerHTML = '';
                if (querySnapshot.empty) { taskList.innerHTML = '<div style="color:#999; text-align:center; padding:20px 0;">データがありません。</div>'; return; }
                querySnapshot.forEach((doc) => {
                    const li = document.createElement('li');
                    li.innerText = doc.data().title;
                    taskList.appendChild(li);
                });
            });
        } catch (error) {
            statusEl.innerText = "設定エラー（Configが未入力です）"; statusEl.style.color = "red";
        }
    </script>
</body>
</html>
