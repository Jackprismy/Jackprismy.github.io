<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>単語帳</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <h1>英単語帳</h1>

  <div id="startScreen">

    <div class="card">
      <h2>範囲を選択</h2>

      <label>開始番号</label>
      <input type="number" id="startNum" placeholder="1">

      <label>終了番号</label>
      <input type="number" id="endNum" placeholder="100">

      <button id="startBtn">開始</button>
      <button id="allBtn">すべてやる</button>
    </div>

  </div>

  <div id="quizScreen" class="hidden">

    <div class="progress" id="progress"></div>

    <div class="card wordCard">
      <div id="questionNumber"></div>
      <div id="word"></div>

      <button id="showMeaningBtn">意味を見る</button>

      <div id="meaningArea" class="hidden">
        <div id="meaning"></div>

        <div class="buttonRow">
          <button id="correctBtn" class="good">できた</button>
          <button id="wrongBtn" class="bad">できなかった</button>
        </div>
      </div>
    </div>

  </div>

  <div id="resultScreen" class="hidden">

    <div class="card">
      <h2>終了！</h2>

      <div id="resultText"></div>

      <div id="wrongList"></div>

      <button id="retryBtn">間違えた問題をもう一度やる</button>
      <button onclick="location.reload()">最初に戻る</button>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
