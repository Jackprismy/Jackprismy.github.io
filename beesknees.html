<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>英単語帳</title>
    <link rel="stylesheet" href="beesknees.css">
  </head>
  <body>
    <main class="app-shell" id="app">
      <section class="screen is-active" id="fileScreen" aria-labelledby="fileTitle">
        <div class="screen-head">
          <p class="eyebrow">Vocabulary</p>
          <h1 id="fileTitle">英単語帳</h1>
        </div>
        <div class="button-list" id="fileList"></div>
        <p class="status-text" id="fileStatus" role="status"></p>
      </section>

      <section class="screen" id="rangeScreen" aria-labelledby="rangeTitle">
        <div class="nav-row">
          <button class="icon-button" type="button" id="backToFiles" aria-label="ファイル選択に戻る">
            <span aria-hidden="true">‹</span>
          </button>
          <div>
            <p class="eyebrow" id="selectedFileLabel">File</p>
            <h1 id="rangeTitle">範囲を選択</h1>
          </div>
        </div>
        <div class="button-list compact" id="rangeList"></div>
        <p class="status-text" id="rangeStatus" role="status"></p>
      </section>

      <section class="screen quiz-screen" id="quizScreen" aria-labelledby="wordText">
        <div class="quiz-top">
          <button class="icon-button" type="button" id="backToRanges" aria-label="範囲選択に戻る">
            <span aria-hidden="true">‹</span>
          </button>
          <div class="quiz-meta">
            <span id="rangeLabel">1〜40</span>
            <span id="progressText">1 / 40</span>
          </div>
        </div>

        <div class="word-area">
          <p class="eyebrow">Question</p>
          <h1 id="wordText">word</h1>
          <button class="sound-button" type="button" id="speakButton">
            <span class="sound-mark" aria-hidden="true">♪</span>
            発音を聞く
          </button>
        </div>

        <div class="choice-list" id="choiceList"></div>

        <aside class="mistake-panel" aria-labelledby="mistakeTitle">
          <div class="mistake-head">
            <h2 id="mistakeTitle">間違えた単語</h2>
            <span id="mistakeCount">0</span>
          </div>
          <div class="mistake-list" id="liveMistakeList"></div>
        </aside>
      </section>

      <section class="screen" id="resultScreen" aria-labelledby="resultTitle">
        <div class="result-block" id="resultBlock">
          <p class="eyebrow">Result</p>
          <h1 id="resultTitle">結果</h1>
          <p class="result-score" id="resultScore"></p>
          <div class="mistake-list result-list" id="resultMistakeList"></div>
          <div class="json-export" id="jsonExportBox" hidden>
            <label class="json-label" for="mistakeJsonText">間違えた単語JSON</label>
            <textarea class="json-output" id="mistakeJsonText" readonly rows="8"></textarea>
            <button class="secondary-button" type="button" id="copyJsonButton">コピー</button>
            <p class="copy-status" id="copyStatus" role="status"></p>
          </div>
          <div class="result-actions" id="resultActions"></div>
        </div>
      </section>
    </main>

    <script src="beesknees.js"></script>
  </body>
</html>
